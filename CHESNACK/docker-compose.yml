# CHESNAKE 一键部署编排：
#   docker compose up -d --build
# 包含 MySQL + Redis + RabbitMQ + Elasticsearch + 后端 + 前端(nginx) 六个服务。
# 首次启动 MySQL 会自动执行 sqlB/chesnake-merged.sql（建库建表 + 种子数据）。
services:

  mysql:
    image: docker.m.daocloud.io/library/mysql:8.4
    container_name: chesnake-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-lyzhmlzq1217.}
    ports:
      # 宿主 3306 常被本地 MySQL 占用，默认映射到 3307（容器间通信不受影响）
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sqlB/chesnake-merged.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    healthcheck:
      # 等待 initdb 脚本执行完成（chesnake.user 表存在才算就绪，避免后端提前连库）
      test: ["CMD-SHELL", "mysql -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD -N -e \"SELECT 1 FROM information_schema.tables WHERE table_schema='chesnake' AND table_name='user'\" 2>/dev/null | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: chesnake-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-chesnake123}
    command: redis-server --requirepass ${REDIS_PASSWORD:-chesnake123} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: docker.m.daocloud.io/library/rabbitmq:3-management
    container_name: chesnake-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-chesnake}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-chesnake123}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  # 商品全文搜索（单节点演示模式，生产请开启安全认证 + 多节点）
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    container_name: chesnake-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  backend:
    build: ./backend
    container_name: chesnake-backend
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://mysql:3306/chesnake?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-lyzhmlzq1217.}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-chesnake123}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-chesnake}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-chesnake123}
      ES_HOSTS: http://elasticsearch:9200
      ES_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:-chesnake-jwt-secret-key-please-change-in-prod-2026-abcdef}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: chesnake-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  es-data:
